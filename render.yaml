# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: cap70-aptitude
    runtime: static
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Cache-Control
        value: no-cache
